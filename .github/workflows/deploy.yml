name: Deploy

# Deploys only when Artur starts it by hand (Actions -> Deploy -> Run workflow, branch master); a push
# to master only runs CI (D42). Runs all checks and a production build, then deploys Firestore rules +
# indexes and Cloud Functions, and publishes the app to GitHub Pages. Can also create a release.
# Target "staging" stops after the dev project: no production, no Pages.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (service account key
# JSON) next to the existing VITE_FIREBASE_* secrets.
#
# Optional App Check (D44): secret VITE_APP_CHECK_SITE_KEY turns on tokens in the app; repository
# variables ENFORCE_APP_CHECK / ENFORCE_APP_CHECK_DEV (true) make startDraw reject calls without one.
#
# Optional staging: with FIREBASE_SERVICE_ACCOUNT_DEV (key of the dev
# Firebase project) the rules and functions go to the dev project
# first; if that fails, production is not touched.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy: production (staging first) or staging only'
        type: choice
        options: [production, staging]
        default: production
      version:
        description: 'Optional release tag, e.g. v2.1.0'
        required: false
      description:
        description: 'Release description'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    # Only master is deployed, whichever branch the run was started on.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      HAS_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV != '' }}
      PRODUCTION: ${{ inputs.target == 'production' }}
    steps:
      - name: Check staging target
        if: inputs.target == 'staging' && env.HAS_STAGING != 'true'
        run: |
          echo "::error::Target staging needs the FIREBASE_SERVICE_ACCOUNT_DEV secret"
          exit 1

      - name: Check deployment secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: |
          missing=()
          for name in FIREBASE_SERVICE_ACCOUNT VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_APP_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deployment secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          # Optional: without it App Check stays off in the built app (D44).
          VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}

      # Staging (dev Firebase project), only when its key is configured.
      - name: Authenticate to the staging project
        id: auth-staging
        if: env.HAS_STAGING == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Deploy Firestore rules, indexes and Functions (staging)
        if: env.HAS_STAGING == 'true'
        env:
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK_DEV }}
        run: |
          echo "ENFORCE_APP_CHECK=${ENFORCE_APP_CHECK:-false}" > "functions/.env.${{ steps.auth-staging.outputs.project_id }}"
          npx firebase deploy --only firestore,functions --project "${{ steps.auth-staging.outputs.project_id }}" --non-interactive

      # Production.
      - name: Authenticate to Google Cloud
        if: env.PRODUCTION == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules, indexes and Functions
        if: env.PRODUCTION == 'true'
        env:
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK }}
        run: |
          echo "ENFORCE_APP_CHECK=${ENFORCE_APP_CHECK:-false}" > "functions/.env.${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          npx firebase deploy --only firestore,functions --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy to GitHub Pages
        if: env.PRODUCTION == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages

      - name: Create release
        if: env.PRODUCTION == 'true' && inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: ${{ inputs.description }}
